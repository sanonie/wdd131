<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Submit a product review including rating, installation date, features, and written feedback.">
    <meta name="author" content="Sanon Bakubamutwe">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <div class="form-container">
            <form id="reviewForm" method="get" action="review.html">
                <fieldset>

                    <!-- Product Name Select -->
                    <div class="form-group">
                        <label for="product">Product Name</label>
                        <select id="product" name="product" required>
                            <option value="" disabled selected>Select a Product ...</option>
                        </select>
                    </div>

                    <!-- Overall Rating -->
                    <div class="form-group">
                        <fieldset class="rating-group">
                            <legend>Overall Rating</legend>
                            <div class="rating-options">
                                <div class="rating-item">
                                    <input type="radio" id="rating-1" name="rating" value="1" required>
                                    <label for="rating-1">1</label>
                                </div>
                                <div class="rating-item">
                                    <input type="radio" id="rating-2" name="rating" value="2">
                                    <label for="rating-2">2</label>
                                </div>
                                <div class="rating-item">
                                    <input type="radio" id="rating-3" name="rating" value="3">
                                    <label for="rating-3">3</label>
                                </div>
                                <div class="rating-item">
                                    <input type="radio" id="rating-4" name="rating" value="4">
                                    <label for="rating-4">4</label>
                                </div>
                                <div class="rating-item">
                                    <input type="radio" id="rating-5" name="rating" value="5">
                                    <label for="rating-5">5</label>
                                </div>
                            </div>
                        </fieldset>
                    </div>

                    <!-- Date of Installation -->
                    <div class="form-group">
                        <label for="install-date">Date of Installation</label>
                        <input type="date" id="install-date" name="install-date" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Your Feedback</legend>

                    <!-- Useful Features -->
                    <div class="form-group">
                        <p class="field-question">Which features did you find useful in the product?</p>
                        <p class="field-instruction">(check all that apply)</p>
                        <fieldset class="checkbox-group">
                            <div class="checkbox-options">
                                <div class="checkbox-item">
                                    <input type="checkbox" id="feature1" name="features" value="Ease of Use">
                                    <label for="feature1">Ease of Use</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="feature2" name="features" value="Performance">
                                    <label for="feature2">Performance</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="feature3" name="features" value="Durability">
                                    <label for="feature3">Durability</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="feature4" name="features" value="Design">
                                    <label for="feature4">Design</label>
                                </div>
                            </div>
                        </fieldset>
                    </div>

                    <!-- Written Review -->
                    <div class="form-group">
                        <label for="review">Written Review <span class="optional-text">(optional)</span></label>
                        <textarea id="review" name="review" rows="6"></textarea>
                    </div>

                    <!-- User Name -->
                    <div class="form-group">
                        <label for="username">User Name <span class="optional-text">(optional)</span></label>
                        <input type="text" id="username" name="username">
                    </div>
                </fieldset>


                <div class="form-actions">
                    <button type="submit" class="btn-submit">Submit Review</button>
                </div>
            </form>
        </div>

        <footer>
            <p>&copy; <span id="currentyear"></span> 🌸 Sanon Bakubamutwe 🌸 | Uganda</p>
            <p id="lastModified"></p>
        </footer>

        <script src="scripts/getdates.js" defer></script>
        <script src="script/form.js" defer></script>
</body>

</html>
